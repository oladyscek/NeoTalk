<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NeoTalk</title>

  <style>
    #new-chat-screen { display: none; }
    #chats           { display: none; }
    #reg-screen      { display: none; }

    .screen {
      display: flex; flex-direction: column; justify-content: center;
      align-items: center; height: 95vh; color: #E0D0FF;
    }

    @keyframes flicker {
      0%,18%,22%,25%,53%,57%,100% { text-shadow: 0 0 10px #8a2be2, 0 0 20px #8a2be2; }
      20%,24%,55% { text-shadow: none; }
    }

    .screen h1 { animation: flicker 3s infinite; font-size: 64px; margin-bottom: 70px; }
    .screen h2 { margin-top: 30px; font-size: 10px; color: #4f328a; }

    body {
      animation: stars 20s linear infinite;
      font-family: 'Press Start 2P', monospace;
      background: #0D0221; margin: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #8a2be2, transparent),
        radial-gradient(1px 1px at 60% 70%, #E0D0FF, transparent),
        radial-gradient(1px 1px at 80% 20%, #8a2be2, transparent),
        radial-gradient(2px 2px at 40% 90%, #E0D0FF, transparent);
      background-size: 200px 200px;
    }

    @keyframes stars { from { background-position: 0 0; } to { background-position: 200px 0; } }

    .screen input {
      caret-color: #8a2be2; font-family: 'Press Start 2P', monospace;
      margin-bottom: 10px; height: 30px; width: 320px; max-width: 90%;
      background-color: #1A0B2E; color: #E0D0FF; border-color: #2e0777;
    }

    .screen input:focus { outline: none; border-color: #8a2be2; }

    .screen button {
      font-family: 'Press Start 2P', monospace;
      background-color: #1A0B2E; color: #E0D0FF; border-color: #2e0777;
      margin-top: 20px; font-size: 24px; padding: 5px 60px;
      box-shadow: 0 4px 0 #1a0b2e, 0 8px 10px rgba(0,0,0,0.5);
      transition: 0.1s;
    }

    .screen button:active { transform: translateY(4px); box-shadow: 0 0 0 #1a0b2e, 0 2px 5px rgba(0,0,0,0.5); }

    #chats { height: 100vh; }

    .chat button {
      font-family: 'Press Start 2P', monospace;
      background-color: #1A0B2E; color: #E0D0FF; border-color: #2e0777;
      font-size: 30px; padding: 5px 30px;
      box-shadow: 0 4px 0 #1a0b2e, 0 8px 10px rgba(0,0,0,0.5); transition: 0.1s;
    }

    .chat button:active { transform: translateY(4px); box-shadow: 0 0 0 #1a0b2e, 0 2px 5px rgba(0,0,0,0.5); }

    .app { display: flex; height: 100vh; color: #E0D0FF; }

    .sidebar {
      width: 220px; background: #1A0B2E; border-right: 2px solid #2e0777;
      display: flex; flex-direction: column;
    }

    .sidebar-header {
      padding: 15px; font-size: 12px; border-bottom: 2px solid #2e0777;
      text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 8px #8a2be2;
      display: flex; justify-content: space-between; align-items: center;
    }

    .sidebar-header button {
      font-family: 'Press Start 2P', monospace;
      background-color: #0D0221; color: #E0D0FF; border: 2px solid #2e0777;
      font-size: 14px; padding: 4px 10px; cursor: pointer;
      box-shadow: 0 2px 0 #0a0117; transition: 0.1s;
    }

    .sidebar-header button:hover { background-color: #2e0777; box-shadow: 0 2px 0 #0a0117, 0 0 8px #8a2be2; }
    .sidebar-header button:active { transform: translateY(2px); box-shadow: none; }

    .chat-list { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
    .chat-list li {
      padding: 12px 15px; border-bottom: 1px solid #2e0777;
      cursor: pointer; font-size: 10px; transition: background 0.15s;
    }
    .chat-list li:hover { background: #2e0777; }
    .chat-list li.active { background: #2e0777; border-left: 3px solid #8a2be2; padding-left: 12px; }

    .chat { flex: 1; display: flex; flex-direction: column; }

    .chat-header {
      padding: 15px; border-bottom: 2px solid #2e0777;
      font-size: 12px; text-transform: uppercase; letter-spacing: 2px;
      text-shadow: 0 0 8px #8a2be2;
    }

    .messages {
      flex: 1; list-style: none; padding: 15px; margin: 0; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    .messages li:first-child { margin-top: auto; }
    .messages li {
      max-width: 60%; padding: 8px 12px; border: 2px solid #2e0777;
      background: #1A0B2E; word-wrap: break-word; font-size: 10px; line-height: 1.6;
    }
    .messages .own   { margin-right: auto; border-color: #8a2be2; box-shadow: 0 0 8px #8a2be2; }
    .messages .other { margin-right: auto; }

    .send { display: flex; gap: 10px; padding: 15px; border-top: 2px solid #2e0777; }
    .send input {
      caret-color: #8a2be2; font-family: 'Press Start 2P', monospace;
      flex: 1; height: 50px; background-color: #1A0B2E; color: #E0D0FF; border-color: #2e0777;
    }
    .send input:focus { outline: none; border-color: #8a2be2; }

    .chat-list::-webkit-scrollbar, .messages::-webkit-scrollbar { display: none; }
    .chat-list, .messages { scrollbar-width: none; }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>

<body>

  <!-- ===== ЛОГИН ===== -->
  <div class="screen" id="login-screen">
    <h1>NeoTalk</h1>
    <input id="login-name" placeholder="Name">
    <input id="login-pass" type="password" placeholder="Password">
    <button id="login-btn">log in</button>
    <button id="to-register">register</button>
    <h2>forgot password? xd lol</h2>
  </div>

  <!-- ===== РЕГИСТРАЦИЯ ===== -->
  <div class="screen" id="reg-screen">
    <h1>NeoTalk</h1>
    <input id="reg-name"  placeholder="Name">
    <input id="reg-pass"  type="password" placeholder="Password">
    <input id="reg-pass2" type="password" placeholder="Repeat password">
    <button id="reg-btn">register</button>
    <button id="to-login">back to log in</button>
  </div>

  <!-- ===== НОВЫЙ ЧАТ ===== -->
  <div class="screen" id="new-chat-screen">
    <h1>New chat</h1>
    <input id="new-chat-input" placeholder="Username">
    <button id="create-chat-btn">create</button>
    <button id="cancel-chat-btn">back</button>
  </div>

  <!-- ===== ЧАТЫ ===== -->
  <div id="chats">
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <span>Chats</span>
            <div>
              <button id="new-chat-btn">+</button>
              <button id="logout-btn">×</button>
            </div>
          </div>
        <ul class="chat-list"><!-- заполняется из сервера --></ul>
      </aside>

      <main class="chat">
        <header class="chat-header"></header>
        <ul class="messages"></ul>
        <form class="send">
          <input placeholder="message...">
          <button>→</button>
        </form>
      </main>
    </div>
  </div>

  <script>
  // ================== STATE ==================
  let myName = '';
  let currentChatId = null;
  const chatsById = {};   // chatId -> { id, chatName, isGroup }

    // ================== WEBSOCKET ==================
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);

  // Единый обработчик открытия
  ws.onopen = () => {
      console.log('ws connected');
      
      // Проверяем токен прямо здесь
      const savedToken = localStorage.getItem('token');
      if (savedToken) {
          console.log('trying auto-auth');
          send({ type: 'auth', token: savedToken });
      }
  };

  ws.onclose   = () => console.log('ws closed');
  ws.onerror   = (e) => console.error('ws error', e);

  function send(obj) {
    console.log('>>', obj);
    ws.send(JSON.stringify(obj));
  }

  // ================== UI ==================
  const loginScreen   = document.getElementById('login-screen');
  const regScreen     = document.getElementById('reg-screen');
  const chatsScreen   = document.getElementById('chats');
  const newChatScreen = document.getElementById('new-chat-screen');

  const loginNameInput = document.getElementById('login-name');
  const loginPassInput = document.getElementById('login-pass');
  const regNameInput   = document.getElementById('reg-name');
  const regPassInput   = document.getElementById('reg-pass');
  const regPass2Input  = document.getElementById('reg-pass2');

  const loginBtn    = document.getElementById('login-btn');
  const registerBtn = document.getElementById('reg-btn');
  const toRegBtn    = document.getElementById('to-register');
  const toLoginBtn  = document.getElementById('to-login');

  const chatList     = document.querySelector('.chat-list');
  const chatHeader   = document.querySelector('.chat-header');
  const messagesList = document.querySelector('.messages');
  const sendForm     = document.querySelector('.send');
  const sendInput    = sendForm.querySelector('input');

  const newChatBtn    = document.getElementById('new-chat-btn');
  const newChatInput  = document.getElementById('new-chat-input');
  const createChatBtn = document.getElementById('create-chat-btn');
  const cancelChatBtn = document.getElementById('cancel-chat-btn');

  // ================== SCREENS ==================
  function showLogin() {
    loginScreen.style.display   = 'flex';
    regScreen.style.display     = 'none';
    chatsScreen.style.display   = 'none';
    newChatScreen.style.display = 'none';
  }
  function showReg() {
    loginScreen.style.display   = 'none';
    regScreen.style.display     = 'flex';
    chatsScreen.style.display   = 'none';
    newChatScreen.style.display = 'none';
  }
  function showChats() {
    loginScreen.style.display   = 'none';
    regScreen.style.display     = 'none';
    chatsScreen.style.display   = 'block';
    newChatScreen.style.display = 'none';
  }
  function showNewChat() {
    chatsScreen.style.display   = 'none';
    newChatScreen.style.display = 'flex';
  }

  toRegBtn.onclick   = showReg;
  toLoginBtn.onclick = showLogin;

  // ================== LOGIN / REG ==================
  loginBtn.onclick = () => {
    const name = loginNameInput.value.trim();
    const pass = loginPassInput.value;
    if (!name) return alert('enter name');
    send({ type: 'login', name, password: pass });
  };

  registerBtn.onclick = () => {
    const name  = regNameInput.value.trim();
    const pass  = regPassInput.value;
    const pass2 = regPass2Input.value;
    if (!name) return alert('enter name');
    if (pass !== pass2) return alert('passwords do not match');
    send({ type: 'reg', name, password: pass });
  };

  [loginNameInput, loginPassInput].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); }));
  [regNameInput, regPassInput, regPass2Input].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') registerBtn.click(); }));

  // ================== SERVER MESSAGES ==================
  ws.onmessage = (e) => {
    let p;
    try { p = JSON.parse(e.data); } catch { return; }
    console.log('<<', p);

    switch (p.type) {
      case 'authStatus':
        if (p.answer === 'ok') {
            myName = p.name; // ← сервер пришлет имя, мы его сохраним
            send({ type: 'getChats' });
            showChats();
        } else {
            // токен протух или неверный
            localStorage.removeItem('token');
            console.log('auto-auth failed:', p.answer);
        }
        break;

      case 'loginStatus':
        if (p.answer === 'ok') {
          myName = loginNameInput.value.trim();

          localStorage.setItem('token', p.token);

          send({ type: 'getChats' });
          showChats();
        } else {
          alert('login: ' + p.answer);
        }
        break;

      case 'regStatus':
        if (p.answer === 'ok') {
          myName = regNameInput.value.trim();

          localStorage.setItem('token', p.token);

          send({ type: 'getChats' });
          showChats();
        } else {
          alert('login: ' + p.answer);
        }
        break;

      case 'getChatStatus':
        if (p.answer === 'ok') {
          renderChatList(p.data || []);
        } else {
          console.error('getChats failed:', p.answer);
        }
        break;

      case 'getHistoryStatus':
        if (p.answer === 'ok') {
          renderHistory(p.data || []);
        } else {
          console.error('getHistory failed:', p.answer);
        }
        break;

      case 'incomedMsg':
        handleIncomingMsg(p);
        break;

      case 'msgStatus':
        if (p.answer !== 'ok') console.warn('msg error:', p.answer);
        break;

      case 'newChatStatus':
        if (p.answer === 'ok') {
          newChatScreen.style.display = 'none';
          chatsScreen.style.display   = 'block';
          send({ type: 'getChats' });   // перечитать список
        } else {
          alert('create chat: ' + p.answer);
        }
        break;
      case 'newChat':
        // кто-то создал с нами чат — перечитать список
        send({ type: 'getChats' });
        break;
    }
    
  };

  // ================== CHAT LIST ==================
  function renderChatList(chats) {
    chatList.innerHTML = '';
    Object.keys(chatsById).forEach(k => delete chatsById[k]);

    if (!chats.length) {
      chatHeader.textContent = '';
      messagesList.innerHTML = '';
      return;
    }

    chats.forEach(c => {
      chatsById[c.id] = c;
      const li = document.createElement('li');
      li.textContent = c.chatName;
      li.dataset.chatId = c.id;
      chatList.appendChild(li);
    });

    const first = chatList.querySelector('li');
    if (first) selectChat(first);
  }

  chatList.onclick = (e) => {
    if (e.target.tagName === 'LI') selectChat(e.target);
  };

  function selectChat(li) {
    document.querySelectorAll('.chat-list li').forEach(x => x.classList.remove('active'));
    li.classList.add('active');

    currentChatId = parseInt(li.dataset.chatId);
    const chat = chatsById[currentChatId];
    chatHeader.textContent = chat ? chat.chatName : '?';

    messagesList.innerHTML = '';
    if (chat) send({ type: 'getHistory', chatId: currentChatId });
  }

  // ================== MESSAGES ==================
  function renderHistory(msgs) {
    messagesList.innerHTML = '';
    msgs.forEach(m => addMessage(m.sender, m.message));
    messagesList.scrollTop = messagesList.scrollHeight;
  }

  function addMessage(sender, text) {
    const li = document.createElement('li');
    li.className = (sender === myName) ? 'own' : 'other';
    li.textContent = sender + ': ' + text;
    messagesList.appendChild(li);
    messagesList.scrollTop = messagesList.scrollHeight;
  }

  // ================== SEND ==================
  sendForm.onsubmit = (e) => {
    e.preventDefault();
    const text = sendInput.value.trim();
    if (!text || !currentChatId) return;

    const chat = chatsById[currentChatId];
    if (!chat) return;

    if (chat.isGroup) {
      send({ type: 'sendMsg', chatId: currentChatId, text, isGroup: true });
    } else {
      send({ type: 'sendMsg', to: chat.chatName, text, isGroup: false });
    }

    addMessage(myName, text);   // локальное эхо
    sendInput.value = '';
    sendInput.focus();
  };

  // ================== INCOMING ==================
  function handleIncomingMsg(p) {
    const chat = chatsById[currentChatId];

    // группа: сервер присылает chatId
    if (p.chatId && p.chatId === currentChatId) {
      addMessage(p.from, p.text);
      return;
    }

    // DM: сервер не присылает chatId, определяем по имени отправителя
    if (!p.chatId && chat && !chat.isGroup && chat.chatName === p.from) {
      addMessage(p.from, p.text);
      return;
    }

    console.log('msg for other chat:', p);
  }

  // ================== NEW CHAT ==================
  newChatBtn.onclick = () => {
    newChatInput.value = '';
    showNewChat();
    newChatInput.focus();
  };

  cancelChatBtn.onclick = showChats;

  createChatBtn.onclick = () => {
    const name = newChatInput.value.trim();
    if (!name) return;
    send({ type: 'createChat', to: name, isGroup: false });
  };
  </script>

</body>
</html>
