<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>NeoTalk</title>

  <!-- Prevent flash of unauthenticated content (FOUC) by checking for token early -->
  <script>
    if (localStorage.getItem('token')) {
      document.documentElement.classList.add('auth-pending');
    }
  </script>

  <style>
    /* ================== GLOBAL STYLES ================== */
    /* Hide auth screens if the user is already logged in (has a token) */
    .auth-pending #login-screen,
    .auth-pending #reg-screen {
      display: none !important;
    }

    /* All screens are hidden by default, JS will toggle them */
    #coming-soon, #new-chat-screen, #new-group-screen, 
    #new-choice-screen, #chats, #reg-screen, #settings-screen {
      display: none; 
    }

    body {
      animation: stars 20s linear infinite;
      font-family: 'Press Start 2P', monospace;
      background: #0D0221; margin: 0;
      background-image:
        radial-gradient(2px 2px at 20% 30%, #8a2be2, transparent),
        radial-gradient(1px 1px at 60% 70%, #E0D0FF, transparent),
        radial-gradient(1px 1px at 80% 20%, #8a2be2, transparent),
        radial-gradient(2px 2px at 40% 90%, #E0D0FF, transparent);
      background-size: 200px 200px;
    }

    @keyframes stars { from { background-position: 0 0; } to { background-position: 200px 0; } }

    @keyframes flicker {
      0%,18%,22%,25%,53%,57%,100% { text-shadow: 0 0 10px #8a2be2, 0 0 20px #8a2be2; }
      20%,24%,55% { text-shadow: none; }
    }

    /* ================== AUTH & MENU SCREENS ================== */
    .screen {
      display: flex; flex-direction: column; justify-content: center;
      align-items: center; height: 95vh; color: #E0D0FF;
    }

    .screen h1 { animation: flicker 3s infinite; font-size: 64px; margin-bottom: 70px; }
    .screen h2 { margin-top: 30px; font-size: 10px; color: #4f328a; }

    .screen input {
      caret-color: #8a2be2; font-family: 'Press Start 2P', monospace;
      margin-bottom: 10px; height: 30px; width: 320px; max-width: 90%;
      background-color: #1A0B2E; color: #E0D0FF; border-color: #2e0777;
    }
    .screen input:focus { outline: none; border-color: #8a2be2; }

    .screen button {
      font-family: 'Press Start 2P', monospace;
      background-color: #1A0B2E; color: #E0D0FF; border-color: #2e0777;
      margin-top: 20px; font-size: 24px; padding: 5px 60px;
      box-shadow: 0 4px 0 #1a0b2e, 0 8px 10px rgba(0,0,0,0.5);
      transition: 0.1s;
    }
    .screen button:active { transform: translateY(4px); box-shadow: 0 0 0 #1a0b2e, 0 2px 5px rgba(0,0,0,0.5); }

    /* ================== GROUP CHIPS (TAGS) ================== */
    #group-chips-container {
      display: flex; flex-wrap: wrap; justify-content: center;
      gap: 10px; margin-bottom: 15px; max-width: 320px;
    }
    .group-chip {
      background-color: #2e0777; color: #E0D0FF; border: 2px solid #8a2be2;
      padding: 5px 10px; font-size: 12px; display: flex; align-items: center;
      gap: 8px; font-family: 'Press Start 2P', monospace; box-shadow: 0 0 8px #8a2be2;
    }
    .group-chip button {
      background: none; border: none; color: #E0D0FF; cursor: pointer;
      font-size: 14px; margin: 0; padding: 0; box-shadow: none; font-family: inherit;
    }
    .group-chip button:hover { color: #00FFFF; background: none; box-shadow: none; }

    /* ================== CHAT INTERFACE ================== */
    #chats { height: 100vh; }
    .app { display: flex; height: 100vh; color: #E0D0FF; }

    .sidebar {
      width: 220px; background: #1A0B2E; border-right: 2px solid #2e0777;
      display: flex; flex-direction: column;
    }
    .sidebar-header {
      padding: 15px; font-size: 12px; border-bottom: 2px solid #2e0777;
      text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 8px #8a2be2;
      display: flex; justify-content: space-between; align-items: center;
    }
    .sidebar-header button {
      font-family: 'Press Start 2P', monospace; background-color: #0D0221; color: #E0D0FF;
      border: 2px solid #2e0777; font-size: 14px; padding: 4px 10px; cursor: pointer;
      box-shadow: 0 2px 0 #0a0117; transition: 0.1s;
    }
    .sidebar-header button:hover { background-color: #2e0777; box-shadow: 0 2px 0 #0a0117, 0 0 8px #8a2be2; }
    .sidebar-header button:active { transform: translateY(2px); box-shadow: none; }

    .chat-list { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
    .chat-list li {
      padding: 12px 15px; border-bottom: 1px solid #2e0777;
      cursor: pointer; font-size: 10px; transition: background 0.15s;
    }
    .chat-list li:hover { background: #2e0777; }
    .chat-list li.active { background: #2e0777; border-left: 3px solid #8a2be2; padding-left: 12px; }

    .chat { flex: 1; display: flex; flex-direction: column; }
    .chat-header {
      padding: 15px; border-bottom: 2px solid #2e0777; font-size: 12px;
      text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 0 8px #8a2be2;
    }

    .messages {
      flex: 1; list-style: none; padding: 15px; margin: 0; overflow-y: auto;
      display: flex; flex-direction: column; gap: 10px;
    }
    /* Pushes messages to the bottom if there are only a few of them */
    .messages li:first-child { margin-top: auto; }
    .messages li {
      max-width: 60%; padding: 8px 12px; border: 2px solid #2e0777;
      background: #1A0B2E; word-wrap: break-word; font-size: 10px; line-height: 1.6;
    }
    .messages .own   { margin-right: auto; border-color: #8a2be2; box-shadow: 0 0 8px #8a2be2; }
    .messages .other { margin-right: auto; }

    .send { display: flex; gap: 10px; padding: 15px; border-top: 2px solid #2e0777; }
    .send input {
      caret-color: #8a2be2; font-family: 'Press Start 2P', monospace;
      flex: 1; height: 50px; background-color: #1A0B2E; color: #E0D0FF; border-color: #2e0777;
    }
    .send input:focus { outline: none; border-color: #8a2be2; }
    .chat button {
      font-family: 'Press Start 2P', monospace; background-color: #1A0B2E; color: #E0D0FF;
      border-color: #2e0777; font-size: 30px; padding: 5px 30px;
      box-shadow: 0 4px 0 #1a0b2e, 0 8px 10px rgba(0,0,0,0.5); transition: 0.1s;
    }
    .chat button:active { transform: translateY(4px); box-shadow: 0 0 0 #1a0b2e, 0 2px 5px rgba(0,0,0,0.5); }

    /* Hide scrollbars but keep scrolling functionality */
    .chat-list::-webkit-scrollbar, .messages::-webkit-scrollbar { display: none; }
    .chat-list, .messages { scrollbar-width: none; }

        /* ================== MOBILE ADAPTATION ================== */
    @media (max-width: 768px) {
      /* Fix for mobile browser address bars */
      body, .app, #chats {
        height: 100dvh; 
      }

      .screen h1 { font-size: 40px; margin-bottom: 40px; } /* Уменьшаем логотип */
      .screen input { height: 40px; font-size: 16px; } /* Поля ввода крупнее (чтобы iOS не звнил) */
      .screen button { font-size: 18px; padding: 10px 40px; } /* Кнопки удобнее для пальцев */

      /* Layout changes for chat app */
      .app {
        position: relative;
        overflow: hidden; /* Prevent scrolling of the whole body */
      }

      /* Sidebar takes full width on mobile */
      .sidebar {
        width: 100%;
        border-right: none;
      }

      /* Chat area slides in from the right */
      .chat {
        position: absolute;
        top: 0;
        left: 100%; /* Hidden to the right by default */
        width: 100%;
        height: 100%;
        background: #0D0221; /* Match body background */
        transition: left 0.3s ease-in-out;
        z-index: 10;
      }

      /* When this class is added to body, the chat slides in */
      body.show-mobile-chat .chat {
        left: 0;
      }

      /* Show the back button on mobile */
      #mobile-back-btn {
        display: block !important;
      }

      /* Adjust header to align back button and title */
      .chat-header {
        display: flex;
        align-items: center;
        gap: 15px;
      }

      /* Messages take up more width on narrow screens */
      .messages li {
        max-width: 85%;
      }
    }
  </style>
  
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png">
</head>

<body>

  <!-- ================== HTML SCREENS ================== -->
  
  <!-- Login Screen -->
  <div class="screen" id="login-screen">
    <h1>NeoTalk</h1>
    <input id="login-name" placeholder="Name">
    <input id="login-pass" type="password" placeholder="Password">
    <button id="login-btn">log in</button>
    <button id="to-register">register</button>
    <h2>forgot password? xd lol</h2>
  </div>

  <!-- Registration Screen -->
  <div class="screen" id="reg-screen">
    <h1>NeoTalk</h1>
    <input id="reg-name"  placeholder="Name">
    <input id="reg-pass"  type="password" placeholder="Password">
    <input id="reg-pass2" type="password" placeholder="Repeat password">
    <button id="reg-btn">register</button>
    <button id="to-login">back to log in</button>
  </div>

  <!-- Choice Screen (Chat or Group) -->
  <div class="screen" id="new-choice-screen">
    <h1>Create...</h1>
    <button id="choice-dm-btn">new chat</button>
    <button id="choice-group-btn">new group</button>
    <button id="choice-back-btn">back</button>
  </div>

  <!-- Direct Message Creation Screen -->
  <div class="screen" id="new-chat-screen">
    <h1>New Chat</h1>
    <input id="new-chat-input" placeholder="Username">
    <button id="create-chat-btn">create</button>
    <button id="cancel-chat-btn">back</button>
  </div>

  <!-- Group Creation Screen -->
  <div class="screen" id="new-group-screen">
    <h1>New Group</h1>
    <input id="new-group-name" placeholder="Group Name">
    
    <!-- Chips (tags) for added members will be injected here by JS -->
    <div id="group-chips-container"></div>
    
    <input id="new-group-member-input" placeholder="Add member (Enter)">
    <button id="create-group-btn">create</button>
    <button id="cancel-group-btn">back</button>
  </div>

  <!-- Settings Screen -->
  <div class="screen" id="settings-screen">
    <h1>settings</h1>
    <button id="settingsProfileBtn">profile</button>
    <button id="settingsLogoutBtn">log out</button>
    <button id="settingsLangBtn">change language</button>
    <button id="backSettingsButton">back</button>
  </div>

  <!-- Coming Soon Placeholder Screen -->
  <div class="screen" id="coming-soon">
    <h1>coming soon..</h1>
    <button id="soonBackBtn">back</button>
  </div>

  <!-- Main Chat Interface -->
  <div id="chats">
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <span>Chats</span>
          <div>
            <button id="new-chat-btn">+</button>
            <button id="settings-btn">⚙</button>
          </div>
        </div>
        <ul class="chat-list"><!-- Chat list injected here by JS --></ul>
      </aside>

      <main class="chat">
        <header class="chat-header">
          <button id="mobile-back-btn" style="display: none; margin: 0; padding: 5px 10px; font-size: 14px;">←</button>
          <span id="chat-title"></span>
        </header>
        <ul class="messages"></ul>
        <form class="send">
          <input placeholder="message...">
          <button>→</button>
        </form>
      </main>
    </div>
  </div>

  <script>
  // ================== STATE ==================
  let myName = '';
  let currentChatId = null;
  const chatsById = {};   // Map: chatId -> { id, chatName, isGroup }
  let groupMembers = [];  // Temporary array to store group members before creating

  // Pagination State (Infinite Scroll)
  let oldestMessageId = null;   // ID of the oldest loaded message
  let hasMoreHistory = true;    // Server flag: are there older messages?
  let isLoadingHistory = false; // Prevent spamming requests while scrolling

  // ================== WEBSOCKET SETUP ==================
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws`);

  ws.onopen = () => {
      console.log('ws connected');
      // Check for saved session token and auto-authenticate
      const savedToken = localStorage.getItem('token');
      if (savedToken) {
          console.log('trying auto-auth');
          send({ type: 'auth', token: savedToken });
      }
  };

  ws.onclose   = () => console.log('ws closed');
  ws.onerror   = (e) => console.error('ws error', e);

  function send(obj) {
    console.log('>>', obj);
    ws.send(JSON.stringify(obj));
  }

  // ================== DOM ELEMENTS ==================
  // Screens
  const loginScreen    = document.getElementById('login-screen');
  const regScreen      = document.getElementById('reg-screen');
  const chatsScreen    = document.getElementById('chats');
  const settingsScreen = document.getElementById('settings-screen'); 
  const soonScreen     = document.getElementById('coming-soon');
  const newChoiceScreen = document.getElementById('new-choice-screen');
  const newChatScreen   = document.getElementById('new-chat-screen');
  const newGroupScreen  = document.getElementById('new-group-screen');

  // Auth Inputs & Buttons
  const loginNameInput = document.getElementById('login-name');
  const loginPassInput = document.getElementById('login-pass');
  const regNameInput   = document.getElementById('reg-name');
  const regPassInput   = document.getElementById('reg-pass');
  const regPass2Input  = document.getElementById('reg-pass2');
  const loginBtn       = document.getElementById('login-btn');
  const registerBtn    = document.getElementById('reg-btn');
  const toRegBtn       = document.getElementById('to-register');
  const toLoginBtn     = document.getElementById('to-login');

  // Settings & Navigation
  const settingsBtn        = document.getElementById('settings-btn');
  const backSettingsButton = document.getElementById('backSettingsButton');
  const settingsProfileBtn = document.getElementById('settingsProfileBtn');
  const settingsLogoutBtn  = document.getElementById('settingsLogoutBtn');
  const settingsLangBtn    = document.getElementById('settingsLangBtn');
  const soonBackBtn        = document.getElementById('soonBackBtn');

  // Chat Interface Elements
  const chatList     = document.querySelector('.chat-list');
  const chatHeader   = document.querySelector('.chat-header');
  const messagesList = document.querySelector('.messages');
  const sendForm     = document.querySelector('.send');
  const sendInput    = sendForm.querySelector('input');

  // Creation UI Elements
  const newChatBtn      = document.getElementById('new-chat-btn');
  const newChatInput    = document.getElementById('new-chat-input');
  const createChatBtn   = document.getElementById('create-chat-btn');
  const cancelChatBtn   = document.getElementById('cancel-chat-btn');

  const choiceDmBtn     = document.getElementById('choice-dm-btn');
  const choiceGroupBtn  = document.getElementById('choice-group-btn');
  const choiceBackBtn   = document.getElementById('choice-back-btn');
  
  const newGroupName        = document.getElementById('new-group-name');
  const newGroupMemberInput = document.getElementById('new-group-member-input');
  const groupChipsContainer = document.getElementById('group-chips-container');
  const createGroupBtn      = document.getElementById('create-group-btn');
  const cancelGroupBtn      = document.getElementById('cancel-group-btn');

  const chatTitle = document.getElementById('chat-title');
  const mobileBackBtn = document.getElementById('mobile-back-btn');

  // ================== INFINITE SCROLL LOGIC ==================
  messagesList.onscroll = () => {
    // Trigger load only when scrolled to the top, there is more history, and no request is in progress
    if (messagesList.scrollTop === 0 && hasMoreHistory && !isLoadingHistory && currentChatId && oldestMessageId) {
      isLoadingHistory = true;
      send({ type: 'getHistory', chatId: currentChatId, beforeId: oldestMessageId });
    }
  };

  // ================== SCREEN MANAGEMENT ==================
  function hideAllScreens() {
    [loginScreen, regScreen, chatsScreen, settingsScreen, soonScreen, 
     newChoiceScreen, newChatScreen, newGroupScreen].forEach(el => {
      el.style.display = 'none';
    });
  }

  function showLogin() { hideAllScreens(); loginScreen.style.display = 'flex'; }
  function showReg() { hideAllScreens(); regScreen.style.display = 'flex'; }
  function showChats() { hideAllScreens(); chatsScreen.style.display = 'block'; }
  function showSettings() { hideAllScreens(); settingsScreen.style.display = 'flex'; }
  function showComingSoon() { hideAllScreens(); soonScreen.style.display = 'flex'; }
  function showNewChoice() { hideAllScreens(); newChoiceScreen.style.display = 'flex'; }
  function showNewChat() { hideAllScreens(); newChatScreen.style.display = 'flex'; }
  function showNewGroup() { hideAllScreens(); newGroupScreen.style.display = 'flex'; }

  toRegBtn.onclick   = showReg;
  toLoginBtn.onclick = showLogin;
  soonBackBtn.onclick = showSettings;
  backSettingsButton.onclick = showChats;
  choiceBackBtn.onclick = showChats;
  cancelChatBtn.onclick = showChats;
  cancelGroupBtn.onclick = showChats;

  // ================== AUTHENTICATION ACTIONS ==================
  loginBtn.onclick = () => {
    const name = loginNameInput.value.trim();
    if (!name) return alert('enter name');
    send({ type: 'login', name, password: loginPassInput.value });
  };

  registerBtn.onclick = () => {
    const name  = regNameInput.value.trim();
    const pass  = regPassInput.value;
    const pass2 = regPass2Input.value;
    if (!name) return alert('enter name');
    if (pass !== pass2) return alert('passwords do not match');
    send({ type: 'reg', name, password: pass });
  };

  // Allow pressing 'Enter' in inputs to trigger the respective buttons
  [loginNameInput, loginPassInput].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') loginBtn.click(); }));
  [regNameInput, regPassInput, regPass2Input].forEach(el =>
    el.addEventListener('keydown', e => { if (e.key === 'Enter') registerBtn.click(); }));

  // ================== SETTINGS ACTIONS ==================
  settingsBtn.onclick        = showSettings;
  settingsProfileBtn.onclick = showComingSoon;
  settingsLangBtn.onclick    = showComingSoon;

  settingsLogoutBtn.onclick = () => {
    const token = localStorage.getItem('token');
    if (token) send({ type: 'logout', token });
    localStorage.removeItem('token');
    location.reload(); // Reload to clear memory and show login screen
  };

  // ================== CREATE CHAT / GROUP LOGIC ==================
  newChatBtn.onclick = showNewChoice;

  choiceDmBtn.onclick = () => {
    newChatInput.value = '';
    showNewChat();
    newChatInput.focus();
  };

  choiceGroupBtn.onclick = () => {
    newGroupName.value = '';
    newGroupMemberInput.value = '';
    groupMembers = []; // Reset members array
    renderChips();     // Clear visual chips
    showNewGroup();
    newGroupName.focus();
  };

  // Render group member chips dynamically
  function renderChips() {
    groupChipsContainer.innerHTML = '';
    groupMembers.forEach((name, index) => {
      const chip = document.createElement('div');
      chip.className = 'group-chip';
      chip.textContent = name;
      
      const btn = document.createElement('button');
      btn.textContent = '×';
      btn.onclick = () => {
        groupMembers.splice(index, 1); // Remove from array
        renderChips();                 // Re-render
      };
      
      chip.appendChild(btn);
      groupChipsContainer.appendChild(chip);
    });
  }

  // Add member to chips array when pressing Enter or Comma
  newGroupMemberInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === ',') {
      e.preventDefault(); // Prevent accidental form submission
      const name = newGroupMemberInput.value.trim().replace(',', '');
      
      if (name && !groupMembers.includes(name)) {
        groupMembers.push(name);
        renderChips();
      }
      newGroupMemberInput.value = '';
    }
  });

  createChatBtn.onclick = () => {
    const name = newChatInput.value.trim();
    if (!name) return;
    send({ type: 'createChat', to: name, isGroup: false });
  };

    // Mobile back button logic
  mobileBackBtn.onclick = () => {
    document.body.classList.remove('show-mobile-chat');
    // Снимаем выделение с чата при выходе
    document.querySelectorAll('.chat-list li').forEach(x => x.classList.remove('active'));
  };

  createGroupBtn.onclick = () => {
    const gName = newGroupName.value.trim();
    
    if (!gName) return alert('enter group name');
    if (groupMembers.length === 0) return alert('add at least one member');
    
    // Send request with array of group members
    send({ 
      type: 'createChat', 
      isGroup: true, 
      name: gName, 
      data: groupMembers 
    });
  };

  // ================== INCOMING WEBSOCKET MESSAGES ==================
  ws.onmessage = (e) => {
    let p;
    try { p = JSON.parse(e.data); } catch { return; }
    console.log('<<', p);

    switch (p.type) {
      case 'authStatus':
        if (p.answer === 'ok') {
            myName = p.name;
            document.documentElement.classList.remove('auth-pending'); // Show UI
            send({ type: 'getChats' });
            showChats();
        } else {
            localStorage.removeItem('token');
            document.documentElement.classList.remove('auth-pending');
            showLogin();
        }
        break;

      case 'loginStatus':
        if (p.answer === 'ok') {
          myName = loginNameInput.value.trim();
          localStorage.setItem('token', p.token);
          document.documentElement.classList.remove('auth-pending');
          send({ type: 'getChats' });
          showChats();
        } else {
          alert('login: ' + p.answer);
        }
        break;

      case 'regStatus':
        if (p.answer === 'ok') {
          myName = regNameInput.value.trim();
          localStorage.setItem('token', p.token);
          document.documentElement.classList.remove('auth-pending');
          send({ type: 'getChats' });
          showChats();
        } else {
          alert('reg: ' + p.answer);
        }
        break;

      case 'getChatStatus':
        if (p.answer === 'ok') {
          renderChatList(p.data || []);
        }
        break;

      case 'getHistoryStatus':
        if (p.answer === 'ok') {
          hasMoreHistory = !!p.hasMore; // Force to boolean in case it's undefined
          renderHistory(p.data || []);
          isLoadingHistory = false;
        } else {
          isLoadingHistory = false;
        }
        break;

      case 'incomedMsg':
        handleIncomingMsg(p);
        break;

      case 'newChatStatus':
        if (p.answer === 'ok') {
          showChats(); 
          send({ type: 'getChats' }); // Refresh chat list to include the new one
        } else {
          alert('create error: ' + p.answer);
        }
        break;
        
      case 'newChat':
        // We were added to a new chat/group by someone else
        send({ type: 'getChats' });
        break;
    }
  };

  // ================== CHAT LIST RENDERING ==================
  function renderChatList(chats) {
    chatList.innerHTML = '';
    Object.keys(chatsById).forEach(k => delete chatsById[k]); // Clear map

    if (!chats.length) {
      chatHeader.textContent = '';
      messagesList.innerHTML = '';
      return;
    }

    chats.forEach(c => {
      chatsById[c.id] = c;
      const li = document.createElement('li');
      li.textContent = c.chatName;
      li.dataset.chatId = c.id;
      chatList.appendChild(li);
    });

    // Auto-select the first chat
    const first = chatList.querySelector('li');
    if (first) selectChat(first);
  }

  chatList.onclick = (e) => {
    if (e.target.tagName === 'LI') selectChat(e.target);
  };

  function selectChat(li) {
    document.querySelectorAll('.chat-list li').forEach(x => x.classList.remove('active'));
    li.classList.add('active');

    currentChatId = parseInt(li.dataset.chatId);
    const chat = chatsById[currentChatId];
    
    // Изменение: записываем имя в chatTitle, а не в header
    chatTitle.textContent = chat ? chat.chatName : '?';

    // Сброс пагинации
    oldestMessageId = null;
    hasMoreHistory = true;
    isLoadingHistory = false;
    messagesList.innerHTML = '';

    // На мобилках сдвигаем экран чата
    document.body.classList.add('show-mobile-chat');

    if (chat) send({ type: 'getHistory', chatId: currentChatId, beforeId: 0 });
  }

  // ================== MESSAGE RENDERING ==================
  function createMessageEl(sender, text) {
    const li = document.createElement('li');
    li.className = (sender === myName) ? 'own' : 'other'; // Right/Left alignment
    li.textContent = sender + ': ' + text;
    return li;
  }

  function renderHistory(msgs) {
    if (msgs.length === 0) {
      hasMoreHistory = false;
      return;
    }

    if (oldestMessageId !== null) {
      // LOADING OLDER MESSAGES (Infinite scroll up)
      const prevHeight = messagesList.scrollHeight; // Save current scroll height

      // Prepend messages to the top (reversed because server sends newest first)
      for (let i = msgs.length - 1; i >= 0; i--) {
        const m = msgs[i];
        const li = createMessageEl(m.sender, m.message);
        messagesList.insertBefore(li, messagesList.firstChild);
      }

      // Maintain scroll position so viewport doesn't jump when messages are added above
      const newHeight = messagesList.scrollHeight;
      messagesList.scrollTop += (newHeight - prevHeight);
    } else {
      // INITIAL CHAT LOAD
      messagesList.innerHTML = '';
      msgs.forEach(m => {
        const li = createMessageEl(m.sender, m.message);
        messagesList.appendChild(li);
      });
      // Scroll to bottom
      messagesList.scrollTop = messagesList.scrollHeight;
    }

    // Update cursor: msgs[0] is the oldest message in this batch
    oldestMessageId = msgs[0].id;
  }

  function addMessage(sender, text) {
    // Check if user is already at the bottom (within 50px tolerance)
    const isAtBottom = messagesList.scrollHeight - messagesList.scrollTop - messagesList.clientHeight < 50;
    
    const li = createMessageEl(sender, text);
    messagesList.appendChild(li);

    // Auto-scroll only if we sent the message OR we were already reading the bottom
    if (sender === myName || isAtBottom) {
      messagesList.scrollTop = messagesList.scrollHeight;
    }
  }

  // ================== SEND MESSAGE ==================
  sendForm.onsubmit = (e) => {
    e.preventDefault();
    const text = sendInput.value.trim();
    if (!text || !currentChatId) return;

    const chat = chatsById[currentChatId];
    if (!chat) return;

    if (chat.isGroup) {
      // Group chat: we identify the destination by chatId
      send({ type: 'sendMsg', chatId: currentChatId, text, isGroup: true });
    } else {
      // DM: we identify the destination by the recipient's username
      send({ type: 'sendMsg', to: chat.chatName, text, isGroup: false });
    }

    addMessage(myName, text); // Local echo: display immediately without waiting for server
    sendInput.value = '';
    sendInput.focus();
  };

  // ================== HANDLE INCOMING MESSAGES ==================
  function handleIncomingMsg(p) {
    const chat = chatsById[currentChatId];

    // If it's for a group and matches our current open group
    if (p.chatId && p.chatId === currentChatId) {
      addMessage(p.from, p.text);
      return;
    }

    // If it's a DM and matches our currently open DM (checking by sender name)
    if (!p.chatId && chat && !chat.isGroup && chat.chatName === p.from) {
      addMessage(p.from, p.text);
      return;
    }

    // Optional: handle messages coming to other chats (e.g., unread badges later)
    console.log('msg for other chat:', p);
  }
  </script>
</body>
