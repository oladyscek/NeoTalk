<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NeoTalk</title>

  <script>
    if (localStorage.getItem('token')) {
      document.documentElement.classList.add('auth-pending');
    }
  </script>

  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="/favicon.png">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0D0221">
</head>

<body>

  <div id="connection-status">CONNECTION LOST. WAITING FOR NETWORK...</div>

  <!-- ================== SCREENS ================== -->
  <div class="screen" id="login-screen">
    <h1>NeoTalk</h1>
    <input id="login-name" placeholder="Name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other">
    <input id="login-pass" type="password" placeholder="Password">
    <button id="login-btn">Log In</button>
    <button id="to-register">Register</button>
  </div>

  <div class="screen" id="reg-screen">
    <h1>NeoTalk</h1>
    <input id="reg-name"  placeholder="Name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other">
    <input id="reg-pass"  type="password" placeholder="Password">
    <input id="reg-pass2" type="password" placeholder="Repeat Password">
    <button id="reg-btn">Register</button>
    <button id="to-login">Back to Log In</button>
  </div>

  <div class="screen" id="new-choice-screen">
    <h1>Create...</h1>
    <button id="choice-dm-btn">New Chat</button>
    <button id="choice-group-btn">New Group</button>
    <button id="choice-back-btn">Back</button>
  </div>

  <div class="screen" id="new-chat-screen">
    <h1>New Chat</h1>
    <input id="new-chat-input" placeholder="Username" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other">
    <button id="create-chat-btn">Create</button>
    <button id="cancel-chat-btn">Back</button>
  </div>

  <div class="screen" id="new-group-screen">
    <h1>New Group</h1>
    <input id="new-group-name" placeholder="Group Name" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other">
    <div id="group-chips-container"></div>
    <input id="new-group-member-input" placeholder="Add Member (Enter)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other">
    <button id="create-group-btn">Create</button>
    <button id="cancel-group-btn">Back</button>
  </div>

  <div class="screen" id="settings-screen">
    <h1>Settings</h1>
    <button id="settingsProfileBtn">Profile</button>
    <button id="settingsLogoutBtn">Log Out</button>
    <button id="settingsLangBtn">Change Language</button>
    <button id="settingsNotifBtn">Enable Notifications</button>
    <button id="backSettingsButton">Back</button>
  </div>

  <div class="screen" id="coming-soon">
    <h1>Coming soon..</h1>
    <button id="soonBackBtn">Back</button>
  </div>

  <!-- ================== MAIN CHAT INTERFACE ================== -->
  <div id="chats">
    <div class="app">
      <aside class="sidebar">
        <div class="sidebar-header">
          <span>Chats</span>
          <div>
            <button id="new-chat-btn">+</button>
            <button id="settings-btn">⚙</button>
          </div>
        </div>
        <ul class="chat-list"></ul>
      </aside>

      <main class="chat empty-chat">
        <header class="chat-header">
          <div class="chat-header-info" id="chat-header-info">
            <button id="mobile-back-btn" style="display: none; margin: 0;">←</button>
            <div id="header-avatar" class="chat-avatar"></div>
            <span id="chat-title"></span>
          </div>
          <button id="msg-actions-btn">⋮</button>
        </header>
        <ul class="messages"></ul>
        <form class="send">
          <input type="search" name="message" placeholder="Message..." maxlength="1000" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-bwignore data-form-type="other">
          <button>→</button>
        </form>
      </main>
    </div>
  </div>

  <!-- ================== FLOATING POPOVERS ================== -->
  <div id="msg-popover" class="msg-popover"></div>
  <div id="dots-menu" class="msg-popover"></div>

  <!-- ================== MODALS ================== -->
  <div id="chat-context-modal">
    <div class="modal-content">
      <button class="modal-close" id="close-chat-modal-btn">×</button>
      <h2>Chat Actions</h2>
      <button class="action-btn" id="chat-modal-action-btn">Delete Chat</button>
    </div>
  </div>

  <div id="profile-modal">
    <div class="modal-content">
      <button class="modal-close" id="close-profile-modal-btn">×</button>
      <div class="chat-avatar profile-avatar" id="profile-avatar"></div>
      <h2 id="profile-name"></h2>
      <button class="action-btn" id="rename-profile-btn">Rename Contact</button>
      <button class="action-btn" id="reset-profile-btn">Reset Name</button>
    </div>
  </div>

  <div id="group-members-modal">
    <div class="modal-content">
      <button class="modal-close" id="close-group-members-modal-btn">×</button>
      <h2 id="group-members-title">Members</h2>
      <ul class="members-list" id="group-members-list"></ul>
      <button class="action-btn" id="rename-group-btn">Rename Group</button>
      <button class="action-btn" id="reset-group-btn">Reset Name</button>
    </div>
  </div>

  <div id="rename-modal">
    <div class="modal-content">
      <button class="modal-close" id="close-rename-modal-btn">×</button>
      <h2>New Name</h2>
      <input type="text" id="rename-input" placeholder="Enter name..." maxlength="50">
      <button class="action-btn" id="save-rename-btn">Save</button>
    </div>
  </div>

  <div id="edit-modal">
    <div class="modal-content">
      <button class="modal-close" id="close-edit-modal-btn">×</button>
      <h2>Edit Message</h2>
      <input type="text" id="edit-input" placeholder="Message..." maxlength="1000">
      <button class="action-btn" id="save-edit-btn">Save</button>
    </div>
  </div>

  <div id="error-modal">
    <div class="modal-content">
      <button class="modal-close" id="close-error-modal-btn">×</button>
      <h2>Error</h2>
      <p id="error-text" style="font-size: 10px; color: #ff5555; margin: 0;"></p>
      <button class="action-btn" id="ok-error-btn">OK</button>
    </div>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
